config_builder:
  enabled: true
  script: |
    #! /usr/bin/env python3
    import json
    import sys

    config = json.load(sys.stdin)
    tags = config.setdefault("tags", {})
    dest_branch = tags.setdefault("dest_branch", {})
    dest_branch["centralized_builder_smoke"] = "^main$"
    print(json.dumps(config))
